<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">网易云音乐 Cookie 导出操作示意图</title>
<desc id="desc">匿名化的 Chrome 界面示意：先登录网易云音乐网页，再打开 Get cookies.txt LOCALLY 扩展，选择 Netscape 格式，点 Export As 保存文件。图中没有真实账号或 Cookie。</desc>
<rect width="1200" height="720" rx="28" fill="#f2f5f9"/>
<text x="56" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">先登录网易云网页，再导出 Cookie</text>
<text x="56" y="104" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#526176">匿名化操作示意图 · 只保存到自己的电脑</text>
